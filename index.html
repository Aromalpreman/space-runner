<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPACE RUNNER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07091d;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:pointer}
#hud{position:fixed;top:14px;left:14px;right:14px;display:none;justify-content:space-between;z-index:3;font-weight:800;letter-spacing:1px}
.badge{background:#0b1030dd;border:1px solid #67dfff55;border-radius:12px;padding:9px 13px}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05061aaa;z-index:5}
.card{width:min(560px,92vw);padding:30px;text-align:center;border-radius:24px;background:#0a0d2fee;border:1px solid #67dfff55;box-shadow:0 0 55px #55dfff22}
h1{font-size:clamp(40px,9vw,72px);margin:0 0 6px;letter-spacing:4px;background:linear-gradient(90deg,#65efff,#c29cff,#ff8bdc);color:transparent;background-clip:text}
p{color:#bcc9e8}.input{width:min(360px,100%);padding:14px;border-radius:12px;border:1px solid #5c7099;background:#101633;color:white;font-size:17px;outline:none;text-align:center}
button{margin-top:15px;padding:13px 26px;border:0;border-radius:12px;font-weight:800;font-size:16px;background:linear-gradient(90deg,#6df2ff,#b99aff);cursor:pointer}
.controls{font-size:13px;line-height:1.8;color:#c7d2ef;margin-top:16px}
#scores{margin:18px auto 0;max-height:180px;overflow:auto;text-align:left;width:min(420px,100%)}
.row{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #ffffff14}.row:first-child{color:#ffe68a;font-weight:800}
.small{font-size:12px;color:#94a4c9}.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="badge">PLAYER: <span id="pn">-</span></div><div class="badge">SCORE: <span id="sc">0</span></div><div class="badge">🏆 <span id="top">-</span></div></div>
<div id="screen"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),screen=document.getElementById('screen');
let W,H,d=1;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
let board=JSON.parse(localStorage.getItem('spaceRunnerPlayers')||'[]'),player='',score=0,run=false,last=0,spd=340,spawn=.8;
const p={x:100,y:0,w:48,h:76,vy:0,jump:false,shield:0,boost:0},obs=[],parts=[],stars=[];
for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.62,r:.5+Math.random()*1.6,s:8+Math.random()*25});
function ground(){return H*.79}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function updateTop(){let b=board[0];document.getElementById('top').textContent=b?b.name+' '+b.score:'-'}
function menu(){let rows=board.slice(0,8).map((a,i)=>`<div class="row"><span>${i+1}. ${esc(a.name)}</span><b>${a.score}</b></div>`).join('');screen.innerHTML=`<div class="card"><h1>🚀 SPACE RUNNER</h1><p>Run across an alien planet in a standard astronaut suit.</p><input id="name" class="input" maxlength="18" placeholder="Enter player name"><br><button id="play">START GAME</button><div class="controls">LEFT CLICK / SPACE → JUMP<br>RIGHT CLICK → ENERGY SHIELD BOOST<br><span class="small">Fly through zero gravity. Use your rocket thrusters to dodge alien rocks, strange aliens, crystals, pods and space plants.</span></div>${rows?'<div class="small" style="margin-top:18px">🏆 HIGH SCORE PLAYERS</div><div id="scores">'+rows+'</div>':''}</div>`;document.getElementById('play').onclick=()=>{player=document.getElementById('name').value.trim()||'Player';start()};document.getElementById('name').onkeydown=e=>{if(e.key==='Enter')document.getElementById('play').click()};setTimeout(()=>document.getElementById('name').focus(),50)}
function start(){obs.length=0;parts.length=0;score=0;spd=340;spawn=.8;p.y=ground()-p.h;p.vy=0;p.jump=false;p.shield=0;run=true;screen.classList.add('hidden');document.getElementById('hud').style.display='flex';document.getElementById('pn').textContent=player;document.getElementById('sc').textContent=0;updateTop();last=performance.now();requestAnimationFrame(loop)}
function burst(px,py,n,col){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*180,vy:(Math.random()-.8)*190,l:.4+Math.random()*.5,col})}
function jump(){
  if(run && !p.jump){
    p.vy=-760;
    p.jump=true;
    p.boost=.22;
    burst(p.x+28,p.y+p.h,14,'#80efff');
    burst(p.x+28,p.y+p.h,7,'#ff9d5c');
  }
}
function special(){
  if(run&&p.shield<=0){
    p.shield=.7;
    p.vy=-760;
    p.boost=.7;
    burst(p.x+28,p.y+p.h,35,'#69f5ff');
    burst(p.x+28,p.y+p.h,20,'#ff8d4d');
  }
}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}})
c.addEventListener('click',jump);c.addEventListener('contextmenu',e=>{e.preventDefault();special()});
function addObs(){
  const types=['ufo','rock','planet','meteor','satellite','crystal'];let t=types[Math.floor(Math.random()*types.length)];
  let w=40+Math.random()*24,h=38+Math.random()*30;if(t==='ufo'){w=58;h=38}if(t==='planet'){w=54;h=54}if(t==='satellite'){w=60;h=42}if(t==='rock'){w=42;h=42}
  obs.push({x:W+35,y:ground()-h,w,h,t});spawn=Math.max(.46,.95-score/2400)+Math.random()*.48;
}
function hit(a,b){return a.x+8<b.x+b.w-5&&a.x+a.w-8>b.x+5&&a.y+8<b.y+b.h-5&&a.y+a.h-7>b.y+5}
function end(){run=false;let s=Math.floor(score);board.push({name:player,score:s});board.sort((a,b)=>b.score-a.score);board=board.slice(0,20);localStorage.setItem('spaceRunnerPlayers',JSON.stringify(board));updateTop();document.getElementById('hud').style.display='none';screen.innerHTML=`<div class="card"><h1>MISSION FAILED</h1><p><b>${esc(player)}</b> scored <b>${s}</b></p><div class="small">🏆 Highest score: ${esc(board[0].name)} — ${board[0].score}</div><div id="scores">${board.slice(0,10).map((a,i)=>`<div class="row"><span>${i+1}. ${esc(a.name)}</span><b>${a.score}</b></div>`).join('')}</div><button id="again">NEXT PLAYER</button></div>`;screen.classList.remove('hidden');document.getElementById('again').onclick=menu}
function update(dt){
  score+=dt*12;
  spd=340+Math.min(score*1.8,400);
  document.getElementById('sc').textContent=Math.floor(score);
  spawn-=dt;
  if(spawn<=0)addObs();

  // GRAVITY: the astronaut falls naturally and uses the rocket to jump.
  p.vy+=1850*dt;
  p.y+=p.vy*dt;
  if(p.y>=ground()-p.h){
    p.y=ground()-p.h;
    p.vy=0;
    p.jump=false;
  }
  if(p.boost>0)p.boost-=dt;
  if(p.shield>0)p.shield-=dt;

  obs.forEach(o=>o.x-=spd*dt);
  for(let i=obs.length-1;i>=0;i--)if(obs[i].x+obs[i].w<0)obs.splice(i,1);

  for(const o of obs)if(hit(p,o)){
    if(p.shield>0){o.x=-100;burst(o.x,o.y,20,'#75efff')}
    else{end();return}
  }

  stars.forEach(s=>{s.x-=s.s*dt;if(s.x<0)s.x=W});
  parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=70*dt;q.l-=dt});
  for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);

  // Continuous tiny rocket exhaust while drifting.
  if(Math.random()<dt*16)burst(p.x+28,p.y+p.h-2,1,p.boost>0?'#ff9b55':'#62eaff');
}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080a28');g.addColorStop(1,'#261640');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#b8b5e8';x.globalAlpha=.75;x.beginPath();x.arc(W*.78,H*.2,Math.min(W,H)*.085,0,7);x.fill();x.globalAlpha=1;stars.forEach(s=>{x.fillStyle='#d9eaff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});x.fillStyle='#15183c';x.beginPath();x.moveTo(0,H*.64);for(let i=0;i<W;i+=80)x.lineTo(i,H*.55-Math.sin(i*.014)*40);x.lineTo(W,ground());x.lineTo(0,ground());x.fill();x.fillStyle='#2a2140';x.fillRect(0,ground(),W,H-ground());obs.forEach(drawObs);drawPlayer();parts.forEach(q=>{x.globalAlpha=Math.max(q.l,0);x.fillStyle=q.col;x.beginPath();x.arc(q.x,q.y,2+Math.random()*3,0,7);x.fill();x.globalAlpha=1})}
function drawObs(o){
  x.save();x.shadowBlur=18;
  if(o.t==='ufo'){
    x.shadowColor='#59eaff';x.fillStyle='#55647e';x.beginPath();x.ellipse(o.x+o.w/2,o.y+o.h*.58,o.w/2,o.h*.27,0,0,7);x.fill();
    x.fillStyle='#253752';x.beginPath();x.ellipse(o.x+o.w/2,o.y+o.h*.38,o.w*.24,o.h*.23,0,0,7);x.fill();x.strokeStyle='#8df6ff';x.lineWidth=2;x.stroke();
    x.fillStyle='#68f4ff';for(let i=0;i<4;i++){x.beginPath();x.arc(o.x+10+i*(o.w-20)/3,o.y+o.h*.67,3,0,7);x.fill()}
    x.fillStyle='#ff75dc';x.beginPath();x.arc(o.x+o.w/2,o.y+o.h*.38,3,0,7);x.fill();
  }else if(o.t==='rock'){
    x.shadowColor='#9c86a8';x.fillStyle='#6b6276';x.beginPath();x.moveTo(o.x+5,o.y+o.h*.82);x.lineTo(o.x+2,o.y+o.h*.38);x.lineTo(o.x+o.w*.3,o.y+5);x.lineTo(o.x+o.w*.75,o.y);x.lineTo(o.x+o.w-3,o.y+o.h*.34);x.lineTo(o.x+o.w-7,o.y+o.h*.86);x.lineTo(o.x+o.w*.48,o.y+o.h);x.closePath();x.fill();
    x.fillStyle='#93879c';x.beginPath();x.arc(o.x+o.w*.3,o.y+o.h*.42,6,0,7);x.arc(o.x+o.w*.68,o.y+o.h*.67,5,0,7);x.fill();
  }else if(o.t==='planet'){
    x.shadowColor='#c16cff';x.fillStyle='#7d55c9';x.beginPath();x.arc(o.x+o.w/2,o.y+o.h/2,o.w*.36,0,7);x.fill();
    x.fillStyle='#a878e8';x.beginPath();x.arc(o.x+o.w*.38,o.y+o.h*.38,o.w*.1,0,7);x.arc(o.x+o.w*.62,o.y+o.h*.57,o.w*.08,0,7);x.fill();
    x.strokeStyle='#e08aff';x.lineWidth=4;x.beginPath();x.ellipse(o.x+o.w/2,o.y+o.h*.58,o.w*.62,o.h*.18,-.12,0,7);x.stroke();
  }else if(o.t==='meteor'){
    x.shadowColor='#ff7048';x.fillStyle='#62566b';x.beginPath();x.moveTo(o.x+3,o.y+o.h);x.lineTo(o.x+8,o.y+14);x.lineTo(o.x+o.w*.4,o.y+2);x.lineTo(o.x+o.w-3,o.y+15);x.lineTo(o.x+o.w-7,o.y+o.h);x.closePath();x.fill();
    x.fillStyle='#ff845e';x.beginPath();x.arc(o.x+o.w*.58,o.y+o.h*.43,5,0,7);x.fill();x.strokeStyle='#ffb078';x.lineWidth=3;x.beginPath();x.moveTo(o.x+5,o.y+15);x.lineTo(o.x-28,o.y-5);x.stroke();
  }else if(o.t==='satellite'){
    x.shadowColor='#62eaff';x.strokeStyle='#b9d6e8';x.lineWidth=3;x.fillStyle='#566b82';x.fillRect(o.x+o.w*.35,o.y+o.h*.3,o.w*.3,o.h*.4);
    x.fillStyle='#426fa0';x.fillRect(o.x,o.y+o.h*.32,o.w*.28,o.h*.32);x.fillRect(o.x+o.w*.72,o.y+o.h*.32,o.w*.28,o.h*.32);
    x.strokeStyle='#78efff';x.beginPath();x.moveTo(o.x+o.w/2,o.y+o.h*.7);x.lineTo(o.x+o.w*.72,o.y+o.h);x.stroke();x.fillStyle='#ff78d7';x.beginPath();x.arc(o.x+o.w*.5,o.y+o.h*.5,3,0,7);x.fill();
  }else{
    x.shadowColor='#8f72ff';x.fillStyle='#7055d9';x.beginPath();x.moveTo(o.x+o.w/2,o.y);x.lineTo(o.x+o.w,o.y+o.h*.72);x.lineTo(o.x+o.w*.7,o.y+o.h);x.lineTo(o.x+o.w*.18,o.y+o.h);x.lineTo(o.x,o.y+o.h*.62);x.closePath();x.fill();
    x.fillStyle='#ddd3ff';x.beginPath();x.moveTo(o.x+o.w*.48,o.y+6);x.lineTo(o.x+o.w*.62,o.y+o.h*.78);x.lineTo(o.x+o.w*.45,o.y+o.h*.82);x.closePath();x.fill();
  }
  x.shadowBlur=0;x.restore();
}
function drawPlayer(){
  // Animated "movie-like" astronaut: running cycle, body bounce, head movement,
  // blinking visor light, moving arms/legs and little suit breathing motion.
  const now=performance.now();
  const t=now/1000;
  const running=Math.abs(p.vy)<180 && !p.jump;
  const cycle=now/125;
  const swing=Math.sin(cycle);
  const swing2=Math.sin(cycle+Math.PI);
  const bob=running ? Math.abs(Math.sin(cycle*0.5))*2.2 : Math.sin(t*5)*0.8;
  const air=p.jump;
  const legSwing=air ? 0.15*Math.sin(t*7) : swing*7;
  const armSwing=air ? 0.15*Math.sin(t*6) : swing2*5;
  const tilt=air ? Math.max(-0.08,Math.min(0.08,p.vy/9000)) : swing*0.025;
  const blink=(Math.sin(t*0.9)>0.985);

  x.save();
  x.translate(p.x+27,p.y+38+bob);
  x.rotate(tilt);
  x.translate(-27,-38);

  // Soft shadow under the astronaut while on the ground.
  if(!air){
    x.globalAlpha=.18;
    x.fillStyle='#000';
    x.beginPath();x.ellipse(27,76,23,5,0,0,7);x.fill();
    x.globalAlpha=1;
  }

  // Life-support backpack with animated status lights.
  x.fillStyle='#8798a9';x.strokeStyle='#e4f1f8';x.lineWidth=1.5;
  x.beginPath();x.roundRect(1,25,12,34,5);x.fill();x.stroke();
  x.fillStyle=Math.sin(t*5)>0?'#55efff':'#294d60';x.fillRect(4,32,6,3);
  x.fillStyle=Math.sin(t*4+1)>0?'#ff73d8':'#542b50';x.fillRect(4,41,6,3);

  // Back exhaust / floating particles.
  if(p.boost>0 || air){
    x.globalAlpha=.75;
    x.fillStyle='#63eaff';
    x.beginPath();x.arc(7,61,2+Math.random()*2,0,7);x.fill();
    x.fillStyle='#ff9a58';
    x.beginPath();x.arc(11,64,1.5+Math.random()*2,0,7);x.fill();
    x.globalAlpha=1;
  }

  // Animated legs behind body.
  x.strokeStyle='#eef5fa';x.lineWidth=9;x.lineCap='round';
  x.beginPath();
  x.moveTo(20,57);x.lineTo(17+legSwing,70);
  x.moveTo(35,57);x.lineTo(38-legSwing,70);
  x.stroke();
  // Boot soles move with the run cycle.
  x.fillStyle='#33465a';
  x.beginPath();
  x.roundRect(11+legSwing,67,13,7,3);
  x.roundRect(33-legSwing,67,13,7,3);
  x.fill();

  // Animated arms.
  x.strokeStyle='#f1f6fa';x.lineWidth=8;
  x.beginPath();
  x.moveTo(12,38);x.lineTo(4-armSwing*.45,51+armSwing*.35);x.lineTo(11,56+armSwing*.15);
  x.moveTo(42,38);x.lineTo(50+armSwing*.45,50-armSwing*.35);x.lineTo(44,56-armSwing*.15);
  x.stroke();
  x.fillStyle='#dce6ee';
  x.beginPath();x.arc(11,57+armSwing*.15,4,0,7);x.arc(44,57-armSwing*.15,4,0,7);x.fill();

  // Suit body.
  x.fillStyle='#f3f7fa';x.strokeStyle='#9aaaba';x.lineWidth=1.5;
  x.beginPath();x.roundRect(10,32,34,27,8);x.fill();x.stroke();

  // Chest panel with pulsing indicator.
  x.fillStyle='#26394f';x.beginPath();x.roundRect(23,39,15,8,2);x.fill();
  x.fillStyle=Math.sin(t*6)>0?'#58efff':'#244c5b';x.fillRect(25,41,3,3);
  x.fillStyle=Math.sin(t*4+2)>0?'#ff65d1':'#5a3154';x.fillRect(30,41,3,3);
  // Tiny animated chest bar.
  x.fillStyle='#9defff';x.fillRect(25,45,10*(.55+.45*Math.sin(t*3)**2),1.5);

  // Neck ring.
  x.fillStyle='#c6d2dc';x.beginPath();x.roundRect(20,27,15,8,4);x.fill();

  // Helmet with tiny breathing/bobbing motion.
  const headY=-1.5+Math.sin(t*2.2)*0.5;
  x.save();x.translate(27,17+headY);x.rotate(Math.sin(t*1.7)*0.035);x.translate(-27,-17-headY);
  x.fillStyle='#eef5fb';x.strokeStyle='#899bad';x.lineWidth=2;
  x.beginPath();x.arc(27,17,17,0,7);x.fill();x.stroke();
  // Visor.
  x.fillStyle='#17283d';x.strokeStyle='#5de9ff';x.lineWidth=2;
  x.beginPath();x.ellipse(28,17,11,9,0,0,7);x.fill();x.stroke();
  // Visor reflection sweeps across like a live animated highlight.
  const shine=(Math.sin(t*1.8)+1)/2;
  x.fillStyle='#bdf7ff';x.globalAlpha=.28+.22*shine;
  x.beginPath();x.ellipse(24+shine*7,13,4,2,0,0,7);x.fill();x.globalAlpha=1;
  // Blinking suit/helmet light.
  x.fillStyle=blink?'#ffffff':'#ff68d0';
  x.beginPath();x.arc(44,0,2.5,0,7);x.fill();
  x.restore();

  // Antenna.
  x.strokeStyle='#cdd9e5';x.lineWidth=2;x.beginPath();x.moveTo(38,6);x.lineTo(43,1);x.stroke();
  x.fillStyle=blink?'#ffffff':'#ff68d0';x.beginPath();x.arc(44,0,2.5,0,7);x.fill();

  // Little shield shimmer.
  if(p.shield>0){
    const pulse=1+Math.sin(t*10)*.035;
    x.strokeStyle='#69efff';x.lineWidth=3;x.shadowBlur=18;x.shadowColor='#69efff';
    x.beginPath();x.arc(27,38,39*pulse,0,7);x.stroke();
    x.shadowBlur=0;
    x.globalAlpha=.22+.12*Math.sin(t*8);
    x.fillStyle='#69efff';x.beginPath();x.arc(27,38,37*pulse,0,7);x.fill();x.globalAlpha=1;
  }
  x.restore();
}

function loop(t){if(!run)return;let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
menu();draw();
</script>
</body>
</html>
